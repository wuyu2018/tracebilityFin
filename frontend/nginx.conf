server {
    listen 80;
    server_name _;                      # 匹配任意域名

    root /usr/share/nginx/html;         # 静态文件根目录
    index index.html;                   # 默认首页文件

    client_max_body_size 10M;           # 允许客户端请求的最大 body 大小
    client_body_timeout 60s;            # 读取客户端 body 的超时时间

    # Gzip 压缩配置
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;               # 小于 1KB 的文件不压缩
    gzip_vary on;                       # 添加 Vary: Accept-Encoding 头

    # 健康检查接口（不记录访问日志）
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # 管理后台 SPA 路由回退
    location /manage {
        try_files $uri $uri/ /tools.html;
        expires -1;
    }

    # 消费者端 SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }

    # 代理后端 API 请求
    location /api {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";   # 启用 keepalive

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_buffering off;              # 关闭代理缓冲（适用于 SSE/WebSocket）
        proxy_request_buffering off;      # 关闭请求体缓冲
    }

    # Actuator 端点（仅允许内网 IP 访问）
    location /actuator {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 访问控制
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
    }

    # 静态资源（图片、字体、CSS、JS 等）长缓存
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 安全响应头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'self'" always;

    # 隐藏所有以点开头的文件或目录（如 .git, .env）
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}